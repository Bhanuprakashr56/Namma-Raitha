server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: /

spring:
  application:
    name: namma-raitha-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:nammaraitha_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: true

# Security & JWT Configuration
app:
  jwt:
    # 256-bit secret key for HMAC-SHA256 signature
    secret: "NammaRaithaAgriSuperSecretKey2026SecureJWTTokenGeneratorWithHighEntropy256BitsMinimumLength"
    expiration-ms: 86400000 # 24 hours
    header: "Authorization"
    prefix: "Bearer "
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173,https://*.run.app"

logging:
  level:
    root: INFO
    com.nammaraitha: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
